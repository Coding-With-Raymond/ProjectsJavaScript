<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Menu JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="selector">
            <div id="setectField">
                <p id="selectText">Select Social Media</p>
                <img src="images/arrow.png" id="arrowIcon" alt="" srcset="">
            </div>

            <ul id="list" class="hide">

                <li class="options">
                    <img src="images/facebook.png" alt="" srcset="">
                    <p>facebook</p>
                </li>

                <li class="options">
                    <img src="images/instagram.png" alt="" srcset="">
                    <p>instagram</p>
                </li>

                <li class="options">
                    <img src="images/pinterest.png" alt="" srcset="">
                    <p>pinterest</p>
                </li>

                <li class="options">
                    <img src="images/twitter.png" alt="" srcset="">
                    <p>twitter</p>
                </li>

                <li class="options">
                    <img src="images/whatsapp.png" alt="" srcset="">
                    <p>whatsapp</p>
                </li>

                <li class="options">
                    <img src="images/youtube.png" alt="" srcset="">
                    <p>youtube</p>
                </li>

            </ul>

        </div>
    </header>

    <script src="main.js"></script>
</body>

</html>
